name: CI

# The previous pipeline could not fail. Lint ended in "|| true", Flutter tests
# ended the same way, it applied only 4 of 10 migrations, and it referenced
# backend/ and frontend/ paths that no longer exist. It had also never run at
# all, because the workflow files lived in "workflows/" rather than
# ".github/workflows/". Nothing here is allowed to swallow a failure.

on:
  push:
    branches: [main, cleanup]
  pull_request:
    branches: [main]

# Least privilege. The previous workflows declared no permissions block and so
# inherited the default token scope.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans the working tree, not full git history. History still contains a
      # leaked Postgres password in commits on main, so a history-wide scan
      # would fail on every run until that is dealt with separately. This
      # catches anything NEW being introduced.
      - name: Run gitleaks against the working tree
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-git --redact --verbose

  api:
    name: API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: chatsaints_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d chatsaints_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/chatsaints_test
      REDIS_URL: redis://localhost:6379
      # Throwaway CI value, long enough to satisfy the boot-time check.
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Migrations are the only way the schema changes. Applying them here also
      # verifies they still apply cleanly to an empty database.
      - name: Apply migrations
        working-directory: apps/api
        run: bunx prisma migrate deploy

      # Prisma 7 no longer chains generate onto migrate, so it is explicit.
      - name: Generate Prisma client
        working-directory: apps/api
        run: bunx prisma generate

      - name: Typecheck
        working-directory: apps/api
        run: bun run typecheck

      - name: Lint
        working-directory: apps/api
        run: bun run lint

      - name: Test
        working-directory: apps/api
        run: bun test

      - name: Verify the seed applies cleanly
        working-directory: apps/api
        run: bun run db:seed

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Install packages
        working-directory: apps/mobile
        run: flutter pub get

      # Analyze and test only. Building iOS or Android artifacts belongs in a
      # release workflow, not on every push.
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test
